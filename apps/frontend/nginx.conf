server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # API: replica el rewrite del dev proxy de Vite (strips /api)
    # Variable en proxy_pass -> resolución del host en runtime (no en config load)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $finances_upstream http://finances_api:3100;
        proxy_pass $finances_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: fallback a index.html (vue-router en history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}